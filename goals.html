<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Garden お題の一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><b>Gateway Garden</b><span>お題の一覧</span><span class="spacer"></span><a href="cards.html">カードの一覧</a><a href="./">ゲームへ</a></header>
<main id="goals" class="cardpage"><p class="loading">読み込み中…</p></main>
<script type="module">
import { buildCatalog } from './src/core/game.js';
import { goalFilterHtml, goalListHtml } from './src/ui/goallist.js';

const get = async (p) => (await fetch(p)).json();
const ids = await get('expansions/index.json');
const exps = await Promise.all(ids.map(async (id) => ({ meta: await get(`expansions/${id}/expansion.json`), cards: await get(`expansions/${id}/cards.json`) })));
buildCatalog(exps); // 拡張のお題（expansion.json の goals）もここで読み込まれる
const origins = exps.map((e) => ({ id: e.meta.id, label: e.meta.name }));
const state = { origins: new Set(origins.map((o) => o.id)) };
const root = document.getElementById('goals');
const draw = () => { root.innerHTML = `${goalFilterHtml(origins, state)}${goalListHtml(origins, state)}`; };
root.addEventListener('change', (ev) => {
  if (ev.target.dataset.filter !== 'origins') return;
  if (ev.target.checked) state.origins.add(ev.target.value); else state.origins.delete(ev.target.value);
  draw();
});
draw();
</script>
<script type="module">import { installScene } from './src/art/scene.js'; installScene(); // 夜空の背景（index と同じ）</script>
</body>
</html>
