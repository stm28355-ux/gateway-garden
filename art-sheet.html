<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Garden 絵の一覧</title>
<style>
  body { margin: 0; padding: 12px 16px; background: radial-gradient(circle at 30% 15%, #2f3b5c, #151a2b 70%); color: #f3ead2; font-family: system-ui, sans-serif; min-height: 100vh; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  figure { margin: 0; padding: 6px; text-align: center; border: 1px solid #c9a45a88; border-radius: 8px; background: rgba(255,255,255,.03); }
  figcaption { font-size: 12px; margin-top: 2px; }
  .small { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
</style>
</head>
<body>
<h1>住人の絵の一覧（基本セット）</h1>
<div class="grid" id="g"></div>
<h1 style="margin-top:16px">お題カードの絵</h1>
<div class="grid" id="goals"></div>
<script type="module">
import { baseArt } from './src/art/base.js';
import { goalArt } from './src/art/goals.js';
import { GOALS } from './src/core/goals.js';
const cards = await (await fetch('expansions/base/cards.json')).json();
document.getElementById('g').innerHTML = cards.map((c) => `<figure>${baseArt(c.name, 96) ?? '（まだ）'}<div class="small">${baseArt(c.name, 32) ?? ''}</div><figcaption>${c.name}</figcaption></figure>`).join('');
document.getElementById('goals').innerHTML = Object.entries(GOALS).map(([id, x]) => `<figure>${goalArt(id, 96)}<div class="small">${goalArt(id, 40)}</div><figcaption><b>${x.name}</b><br><small>${x.text}</small></figcaption></figure>`).join('');
</script>
</body>
</html>
