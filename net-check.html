<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通信の確かめ</title>
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  h1 { color: var(--gold-hi); margin-bottom: 4px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
  .box h2 { margin: 0 0 4px; }
  .ok { color: #8fe0a0; font-weight: 700; } .ng { color: #ff9b8a; font-weight: 700; } .mid { color: var(--gold-hi); font-weight: 700; }
  pre { white-space: pre-wrap; font-size: 12px; background: rgba(0,0,0,.25); padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>通信の確かめ</h1>
  <p class="muted">通信対戦でつながらないときに開くページです。ホストと入る人の両方で開き、いちばん下の結果を見比べてください。1〜3は1人で（30秒ほど）、4は2人で同時に試します。</p>
  <p><button class="primary" id="go">1〜3を確かめる</button></p>
  <div class="box"><h2>1. 合図の中継に届くか</h2><div id="r1" class="muted">まだ</div></div>
  <div class="box"><h2>2. NAT の形（直接つながりやすいか）</h2><div id="r2" class="muted">まだ</div></div>
  <div class="box"><h2>3. TURN（中継）が使えるか</h2><div id="r3" class="muted">まだ</div></div>
  <div class="box"><h2>4. 相手と試す（2人で同時に）</h2>
    <p class="muted">2人で同じ合言葉を入れて、1分以内に両方とも「試す」を押してください。ゲームの部屋とは別の、試し用の部屋に入ります。最大90秒待ちます。</p>
    <p><input id="pcode" placeholder="2人で決めた合言葉"> <button id="pgo">試す</button></p>
    <div id="r4" class="muted">まだ</div></div>
  <div class="box"><h2>結果（相手に送る用）</h2><pre id="sum">まだ</pre><button id="copy" disabled>結果をコピー</button></div>
  <p><a href="index.html">ゲームに戻る</a></p>
</main>
<script type="module">
import { TURN_URL, turnServers } from './src/net/turn.js';
import { APP_VERSION } from './src/version.js';
import { TRYSTERO, roomConfig } from './src/net/trystero.js';

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// ゲームと同じつなぎ方（?net=mqtt などもゲームと同じく効く）
const STRATEGY = new URLSearchParams(location.search).get('net') ?? 'nostr';
const RELAY_ONLY = new URLSearchParams(location.search).get('relay') === '1';
const loadTrystero = () => import(`${TRYSTERO}/${STRATEGY}/+esm`);
const results = {};
function showSum() {
  const head = `Gateway Garden ${APP_VERSION}・${new Date().toLocaleString('ja-JP')}・つなぎ方 ${STRATEGY}`;
  $('sum').textContent = [head, ...[1, 2, 3, 4].map((k) => results[k]).filter(Boolean)].join('\n');
  $('copy').disabled = false;
}

// candidate 文字列の中身（IP・番号・種類）
function parse(c) {
  const p = c.candidate.split(' ');
  return { proto: p[2]?.toLowerCase(), ip: p[4], port: Number(p[5]), type: p[7] };
}

// 1つの線で ICE の候補を集める（同じ線で複数の STUN に聞くので、出口の番号を比べられる）
async function gather(config, ms = 8000) {
  const pc = new RTCPeerConnection(config);
  pc.createDataChannel('check');
  const found = [];
  const done = new Promise((resolve) => {
    pc.onicecandidate = (e) => { if (e.candidate && e.candidate.candidate) found.push(parse(e.candidate)); else if (!e.candidate) resolve(); };
    setTimeout(resolve, ms);
  });
  await pc.setLocalDescription(await pc.createOffer());
  await done;
  pc.close();
  return found;
}

// ゲームと同じ設定（同じ中継）で入る
async function checkRelays() {
  const mod = await loadTrystero();
  const room = mod.joinRoom(roomConfig(STRATEGY), `netcheck-solo-${Math.random().toString(36).slice(2)}`);
  await sleep(6000);
  const socks = Object.values(mod.getRelaySockets?.() ?? {});
  const open = socks.filter((s) => s.readyState === 1).length;
  room.leave();
  return { open, total: socks.length };
}

async function run() {
  $('go').disabled = true;

  $('r1').textContent = '確かめています…';
  try {
    const { open, total } = await checkRelays();
    const good = open > 0;
    $('r1').innerHTML = `<span class="${good ? 'ok' : 'ng'}">${good ? '届いています' : '届いていません'}</span>（中継 ${total} か所のうち ${open} か所につながった）`
      + (good ? '' : '<br>回線やセキュリティソフトが WebSocket をふさいでいるかもしれません。ゲームのアドレスの後ろに ?net=mqtt や ?net=torrent を付けると、別の中継を試せます。');
    results[1] = `1 中継：${open}/${total}`;
  } catch (e) {
    $('r1').innerHTML = `<span class="ng">確かめられませんでした</span>（${e.message}）`;
    results[1] = `1 中継：失敗 ${e.message}`;
  }

  $('r2').textContent = '確かめています…';
  const cands = await gather({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }] });
  const srflx = cands.filter((c) => c.type === 'srflx' && c.proto === 'udp');
  const byIp = {};
  for (const c of srflx) (byIp[c.ip] ??= new Set()).add(c.port);
  const ports = Object.values(byIp);
  let kind;
  if (!srflx.length) {
    kind = 'STUN の答えなし（UDP がふさがれている？）';
    $('r2').innerHTML = '<span class="ng">外の STUN から答えがありません</span>。UDP がふさがれている回線のようです（会社・学校の回線など）。直接はつながりにくく、TURN（3）が要ります。';
  } else if (ports.some((s) => s.size > 1)) {
    kind = '越えにくい NAT';
    $('r2').innerHTML = '<span class="ng">越えにくい NAT</span>です（行き先ごとに出口の番号が変わる形。スマホの回線・テザリング・マンションの回線に多い）。相手も同じような回線だと、直接はつながりません。TURN（3）が要ります。';
  } else if (srflx.length === 1) {
    kind = 'ふつうの NAT';
    $('r2').innerHTML = '<span class="ok">ふつうの NAT</span>です（どの行き先にも同じ出口の番号）。直接つながりやすい回線です。';
  } else {
    kind = 'たぶんふつうの NAT';
    $('r2').innerHTML = '<span class="mid">たぶんふつうの NAT</span>です（出口の番号はそれぞれ1つ）。';
  }
  const exits = Object.entries(byIp).map(([ip, s]) => `${ip.includes(':') ? 'IPv6' : 'IPv4'} ${s.size}つ`).join('・') || 'なし';
  results[2] = `2 NAT：${kind}（出口 ${exits}）`;

  $('r3').textContent = '確かめています…';
  if (!TURN_URL) {
    $('r3').innerHTML = '<span class="mid">まだ設定していません</span>（今のゲームは TURN を使わず、直接だけでつないでいます）。';
    results[3] = '3 TURN：未設定';
  } else {
    const turn = await turnServers();
    if (!turn) {
      $('r3').innerHTML = '<span class="ng">TURN の鍵を取れませんでした</span>。';
      results[3] = '3 TURN：鍵を取れない';
    } else {
      const relay = (await gather({ iceServers: turn, iceTransportPolicy: 'relay' }, 10000)).filter((c) => c.type === 'relay');
      $('r3').innerHTML = relay.length ? `<span class="ok">使えます</span>（中継の候補 ${relay.length} 個）。直接つながらない相手とも、中継を通ってつながるはずです。` : '<span class="ng">使えません</span>（中継の候補が出ませんでした）。';
      results[3] = `3 TURN：${relay.length ? `使える（${relay.length}）` : '使えない'}`;
    }
  }

  showSum();
  $('go').disabled = false;
}

// ---- 4. 相手と試す ----
// Trystero が作る線（RTCPeerConnection）を見張って、「相手の合図が届いたか」「直接の線が張れたか」「線の種類」を調べる
const watched = [];
class WatchedPC extends RTCPeerConnection {
  constructor(cfg) {
    super(cfg);
    const rec = { pc: this, signal: false, states: [], remoteTypes: new Set() };
    watched.push(rec);
    const setRemote = this.setRemoteDescription.bind(this);
    this.setRemoteDescription = (d) => {
      rec.signal = true;
      for (const l of (d?.sdp ?? '').split(/\r?\n/)) if (l.startsWith('a=candidate:')) rec.remoteTypes.add(l.split(' ')[7]);
      return setRemote(d);
    };
    const addIce = this.addIceCandidate.bind(this);
    this.addIceCandidate = (c) => { if (c?.candidate) rec.remoteTypes.add(c.candidate.split(' ')[7]); return addIce(c); };
    this.addEventListener('iceconnectionstatechange', () => rec.states.push(this.iceConnectionState));
  }
}

// つながった線の種類（host＝同じ回線の中・srflx／prflx＝NAT を越えて直接・relay＝TURN 経由）
async function pairOf(pc) {
  if (!pc) return null;
  const stats = await pc.getStats();
  let pair = null;
  stats.forEach((s) => { if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s; });
  if (!pair) return null;
  const l = stats.get(pair.localCandidateId);
  const r = stats.get(pair.remoteCandidateId);
  return { local: l?.candidateType, remote: r?.candidateType, proto: l?.protocol };
}

async function peerTest() {
  const code = $('pcode').value.trim();
  if (!code) { $('r4').innerHTML = '<span class="ng">合言葉を入れてください</span>'; return; }
  $('pgo').disabled = true;
  watched.length = 0;
  const mod = await loadTrystero();
  const turnConfig = await turnServers();
  // ?relay=1：直接の線を使わず、TURN の中継だけでつなぐ（同じ回線の中でも TURN を試せる）
  const net = RELAY_ONLY && turnConfig ? { rtcConfig: { iceServers: turnConfig, iceTransportPolicy: 'relay' } } : (turnConfig ? { turnConfig } : {});
  if (RELAY_ONLY && !turnConfig) { $('r4').innerHTML = '<span class="ng">TURN が使えないので、中継だけの試しはできません</span>'; $('pgo').disabled = false; return; }
  const room = mod.joinRoom(roomConfig(STRATEGY, { password: code, rtcPolyfill: WatchedPC, ...net }), `netcheck-${code}`);
  const ping = room.makeAction('ping');
  const pong = room.makeAction('pong');
  ping.onMessage = (t, ctx) => pong.send(t, { target: ctx.peerId });
  let rtt = null;
  pong.onMessage = (t) => { rtt = Date.now() - t; };
  let joined = null;
  room.onPeerJoin = (id) => { joined = id; ping.send(Date.now(), { target: id }); };

  const t0 = Date.now();
  const sec = () => Math.round((Date.now() - t0) / 1000);
  while (Date.now() - t0 < 90000 && !(joined && rtt !== null)) {
    const sig = watched.some((w) => w.signal);
    const st = watched.map((w) => w.pc.iceConnectionState).join('・') || 'まだ線なし';
    $('r4').innerHTML = `待っています… ${sec()}秒（相手の合図：${sig ? '届いた' : 'まだ'}、線：${st}）`;
    await sleep(1000);
  }

  const sig = watched.some((w) => w.signal);
  const failed = watched.some((w) => w.states.includes('failed'));
  const remoteTypes = [...new Set(watched.flatMap((w) => [...w.remoteTypes]))].join('・') || 'なし';
  if (joined) {
    // つながった直後は線の種類がまだ数えられていないことがあるので、少し待って何度か見る
    const pc = room.getPeers()[joined] ?? watched.find((w) => ['connected', 'completed'].includes(w.pc.iceConnectionState))?.pc;
    let pair = null;
    for (let i = 0; i < 5 && !pair; i++) { pair = await pairOf(pc); if (!pair) await sleep(500); }
    const via = !pair ? '直接' : (pair.local === 'relay' || pair.remote === 'relay') ? 'TURN の中継を通して' : (pair.local === 'host' && pair.remote === 'host') ? '同じ回線の中で直接' : 'NAT を越えて直接';
    $('r4').innerHTML = `<span class="ok">つながりました</span>（${sec()}秒・${via}・往復 ${rtt ?? '?'}ms）`;
    results[4] = `4 相手と${RELAY_ONLY ? '（中継だけ）' : ''}：つながった ${sec()}秒（${pair ? `${pair.local}↔${pair.remote} ${pair.proto}` : '種類不明'}・往復${rtt ?? '?'}ms）`;
  } else if (!sig) {
    $('r4').innerHTML = '<span class="ng">相手の合図が届きませんでした</span>。合言葉か押す時間がずれているか、2人が同じ中継に届いていません。合言葉を確かめてもう一度。それでもだめなら、2人ともアドレスの後ろに ?net=mqtt を付けて試してください。';
    results[4] = '4 相手と：相手の合図が届かない（合言葉・時間のずれか、中継の問題）';
  } else {
    $('r4').innerHTML = `<span class="ng">相手の合図は届きましたが、直接の線が張れませんでした</span>（${failed ? '線が失敗' : '時間切れ'}）。NAT やファイアウォールで直接つながらない組み合わせです。TURN（3）が要ります。`;
    results[4] = `4 相手と：合図は届いたが線が張れない（${failed ? 'failed' : '時間切れ'}・相手の候補 ${remoteTypes}）`;
  }
  showSum();
  room.leave();
  $('pgo').disabled = false;
}

$('go').addEventListener('click', run);
$('pgo').addEventListener('click', peerTest);
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('sum').textContent); $('copy').textContent = 'コピーしました'; } catch { $('copy').textContent = 'コピーできませんでした'; }
});
</script>
</body>
</html>
