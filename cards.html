<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Garden カードの一覧</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><b>Gateway Garden</b><span>カードの一覧</span><button id="explain" title="キーワードの後ろに説明を書くか"></button><span class="spacer"></span><a href="./">ゲームへ</a></header>
<main id="cards" class="cardpage"><p class="loading">読み込み中…</p></main>
<script type="module">
import { buildCatalog } from './src/core/game.js';
import { filterHtml, listHtml, allState, toggleFilter } from './src/ui/cardlist.js';
import { glossaryHtml, setExplain, getExplain } from './src/ui/describe.js';

const get = async (p) => (await fetch(p)).json();
const ids = await get('expansions/index.json');
const exps = await Promise.all(ids.map(async (id) => ({ meta: await get(`expansions/${id}/expansion.json`), cards: await get(`expansions/${id}/cards.json`) })));
const cat = buildCatalog(exps);
const origins = exps.map((e) => ({ id: e.meta.id, name: `${e.meta.name}（版 ${e.meta.version}・${e.cards.length}種類）` }));
const originNames = Object.fromEntries(exps.map((e) => [e.meta.id, e.meta.name]));
const state = allState(origins);
const root = document.getElementById('cards');
try { setExplain(localStorage.getItem('gg-explain') === 'on'); } catch { /* 保存できなくても見られる */ }
const btn = document.getElementById('explain');
const draw = () => {
  btn.textContent = `説明：${getExplain() ? 'あり' : 'なし'}`;
  root.innerHTML = `<details class="rules"><summary>キーワード</summary>${glossaryHtml()}</details>${filterHtml(origins, state)}${listHtml(Object.values(cat.cards), state, { originNames })}`;
};
btn.addEventListener('click', () => {
  setExplain(!getExplain());
  try { localStorage.setItem('gg-explain', getExplain() ? 'on' : 'off'); } catch { /* 同上 */ }
  draw();
});
root.addEventListener('change', (ev) => { if (ev.target.dataset.filter) { toggleFilter(state, ev.target); draw(); } });
draw();
</script>
</body>
</html>
